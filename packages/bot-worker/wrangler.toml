name = "tgbot"
main = "src/index.js"
compatibility_date = "2026-04-12"
workers_dev = false
routes = []

[vars]
PUBLIC_WEBHOOK_URL = ""
WEBUI_SITE_URL = ""

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "Libchecker_TG_Bot"

[[r2_buckets]]
binding = "REPORT_DATA_BUCKET"
bucket_name = "tgbot-report-data-dev"

[env.preview]
name = "tgbot-preview"
workers_dev = true
routes = []

[env.preview.vars]
APP_ENV = "preview"
PUBLIC_WEBHOOK_URL = ""
WEBUI_SITE_URL = ""

[env.preview.observability]
enabled = true
head_sampling_rate = 1

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.preview.analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "Libchecker_TG_Bot_Preview"

[[env.preview.r2_buckets]]
binding = "REPORT_DATA_BUCKET"
bucket_name = "tgbot-preview-report-data"

[env.production]
name = "tgbot"
workers_dev = false
routes = []

[env.production.vars]
APP_ENV = "production"
PUBLIC_WEBHOOK_URL = ""
WEBUI_SITE_URL = ""

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.production.analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "Libchecker_TG_Bot"

[[env.production.r2_buckets]]
binding = "REPORT_DATA_BUCKET"
bucket_name = "tgbot-report-data"
